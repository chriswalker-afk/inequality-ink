name: Verify Inequality Ink
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate mathematical questions and pixel art
        run: node --test *.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check app.mjs
          node --check help/how-to-play.mjs
          node --check model.mjs
          node --check picture-engine.mjs
          node --check pictures.mjs
          node --check paint-engine.mjs
          node --check paint-pictures.mjs
          node --check starter-pictures.mjs
          node --check paint-starters.mjs
          node --check regions/regions-app.mjs
          node --check regions/regions-engine.mjs
          node --check regions/curved-engine.mjs
          node --check regions/curve-pictures.mjs
          node --check regions/curve-art.mjs
          node --check regions/plot-engine.mjs
          node --check regions/plot-pictures.mjs
          node --check regions/plot-art.mjs
          node --check regions/complex-quest-model.mjs
          node --check regions/complex-quest-geometry.mjs
          node --check regions/complex-quest-app.mjs
          node --check regions/graph-mural-model.mjs
          node --check regions/graph-mural-art.mjs
          node --check regions/graph-mural.mjs
